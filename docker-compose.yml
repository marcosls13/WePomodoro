name: WePomodoro

services:
  backend:
    build: ./backend
    container_name: backend
    image: backend:WePomodoro
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - /app/node_modules
  frontend:
    build: ./frontend
    container_name: frontend
    image: frontend:WePomodoro
    ports:
      - "5173:5173"
