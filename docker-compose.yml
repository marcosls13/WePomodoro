services:
    backend:
      build: ./backend
      ports:
        - "3000:3000"
      environment:
        DATABASE_URL: ${DATABASE_URL}
      depends_on:
        - postgres
      volumes:
        - ./backend:/app
        - /app/node_modules

    postgres:
      image: postgres:16-alpine
      environment:
        POSTGRES_USER: ${POSTGRES_USER}
        POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        POSTGRES_DB: ${POSTGRES_DB}
      volumes:
        - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
